name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # این پروژه فایل gradlew را همراه ندارد (Gradle wrapper نبود)، پس
      # به‌جای «./gradlew build» از خودِ اکشن setup-gradle می‌خواهیم یک
      # نسخه‌ی مشخص از Gradle را نصب و روی PATH بگذارد؛ دیگر نیازی به
      # gradlew نیست. اگر بعداً خودت با دستور «gradle wrapper» یک
      # gradlew واقعی به ریشه‌ی پروژه اضافه کردی، می‌توانی این کار را
      # حذف کنی و مستقیم «./gradlew assembleDebug» صدا بزنی.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shopvpn-admin-debug
          path: app/build/outputs/apk/debug/*.apk
