name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # این پروژه فایل gradlew را همراه ندارد (Gradle wrapper نبود)، پس
      # به‌جای «./gradlew build» از خودِ اکشن setup-gradle می‌خواهیم یک
      # نسخه‌ی مشخص از Gradle را نصب و روی PATH بگذارد؛ دیگر نیازی به
      # gradlew نیست. اگر بعداً خودت با دستور «gradle wrapper» یک
      # gradlew واقعی به ریشه‌ی پروژه اضافه کردی، می‌توانی این کار را
      # حذف کنی و مستقیم «./gradlew assembleDebug» صدا بزنی.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ریشه‌ی واقعی پروژه (جایی که settings.gradle.kts هست) را پیدا
      # می‌کند، چون بسته به نحوه‌ی آپلود فایل‌ها به گیت‌هاب ممکن است
      # داخل یک زیرپوشه قرار گرفته باشند. نتیجه را در PROJECT_DIR
      # ذخیره می‌کند تا مراحل بعدی از آن استفاده کنند.
      - name: Locate Gradle project root
        id: locate
        run: |
          MATCH=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name "settings.gradle.kts" -o -maxdepth 3 -name "settings.gradle" | head -n 1)
          if [ -z "$MATCH" ]; then
            echo "::error::settings.gradle(.kts) پیدا نشد. فایل‌های پروژه درست آپلود نشده‌اند."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$MATCH")
          echo "Project root found at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shopvpn-admin-debug
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
