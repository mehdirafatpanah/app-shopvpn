name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # به‌جای آپلود تک‌تک فایل‌ها (که موقع آپلود از موبایل ساختار
      # پوشه‌ها بهم می‌ریزد)، فقط یک فایل ZIP از کل پروژه را در ریشه‌ی
      # ریپازیتوری آپلود کن. این مرحله خودش zip را پیدا کرده،
      # extract می‌کند و ریشه‌ی واقعی پروژه (پوشه‌ای که
      # settings.gradle.kts در آن است) را برای مراحل بعد مشخص می‌کند.
      - name: Extract project zip
        id: locate
        run: |
          set -e
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::هیچ فایل .zip در ریشه‌ی ریپو پیدا نشد. یک فایل zip از کل پروژه در ریشه‌ی ریپازیتوری آپلود کن."
            exit 1
          fi
          echo "Found zip: $ZIP_FILE"
          EXTRACT_DIR="$GITHUB_WORKSPACE/_extracted"
          mkdir -p "$EXTRACT_DIR"
          unzip -o -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          MATCH=$(find "$EXTRACT_DIR" -maxdepth 4 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          if [ -z "$MATCH" ]; then
            echo "::error::داخل zip فایل settings.gradle.kts پیدا نشد. مطمئن شو zip از ریشه‌ی پروژه‌ی صحیح ساخته شده."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$MATCH")
          echo "Project root found at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shopvpn-admin-debug
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
